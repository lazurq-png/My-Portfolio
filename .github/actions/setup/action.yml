name: Setup
description: pnpm, Node.js and the project's dependencies -- the steps every CI job needs after checkout.

# One copy of the setup instead of one per job. Checkout stays in each job:
# GitHub can only find this file once the repository is checked out.
runs:
  using: composite
  steps:
    # No `version` input: the pnpm version comes from the `packageManager`
    # field in package.json. Setting both makes action-setup fail the step
    # whenever they disagree.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # .node-version is also what Cloudflare Pages builds with, so CI tests the
    # Node.js version that ships.
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
