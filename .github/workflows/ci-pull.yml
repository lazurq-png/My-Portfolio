name: CI

on:
  pull_request:
    branches: [master]

# Superseded runs (force-push / rapid pushes to a PR) are cancelled rather
# than left to burn every matrix leg to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repo, so the token is read-only by default.
permissions:
  contents: read

jobs:
  # The static checks and the Vitest suite, in one job on purpose: "Unit tests"
  # is a required check on master, so everything in it blocks a merge. A
  # separate type-check job was not required and only reported (ADR 0012).
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js and dependencies
        uses: ./.github/actions/setup

      # ESLint (incl. a11y rules for .astro templates) + Prettier formatting check.
      - name: Lint
        run: pnpm lint

      # Makes tsconfig.json's `strict` setting binding (ADR 0012). `astro check`
      # covers the .astro templates too, so a bad <Layout> prop or an unguarded
      # optional frontmatter field fails here rather than rendering `undefined`.
      # It runs `astro sync` itself, regenerating the gitignored .astro types.
      - name: Type check
        run: pnpm check

      # docs/overview.html must be re-stamped after an ADR changes (docs/README.md).
      - name: Docs overview in sync
        run: pnpm docs:check

      - name: Run Vitest
        run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Asserts the security headers and one-page-per-post routing against the
      # artifact uploaded below -- the same bundle e2e runs on and Cloudflare
      # serves. Has to live here rather than in unit-tests: there is no dist/
      # in that job to look at.
      - name: Check build output
        run: pnpm test:build

      # dist/ is ~200K, so this is far cheaper than recompiling via the dev
      # server in each e2e leg -- and it tests the bundle actually deployed.
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.specs.outputs.value }}
      code: ${{ steps.code.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/e2e-filters.yml

      # `code` is true when at least one changed file is outside docs/blog. A
      # docs/blog-only PR skips e2e on it; unit tests and build still run --
      # build is what catches a bad post's frontmatter or a slug clash. Its own
      # step because `predicate-quantifier` applies to every filter in a step,
      # and e2e-filters.yml needs the default `some`.
      - name: Detect non-docs changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!src/content/blog/**'
              - '!*.md'

      # `shared` is an anchor holder, not a spec -- drop it so the matrix only
      # ever contains real src/__tests__/e2e/<name>.spec.ts basenames.
      - name: Build spec matrix
        id: specs
        run: |
          value=$(jq -c 'map(select(. != "shared"))' <<<'${{ steps.filter.outputs.changes }}')
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Specs to run: $value"

  e2e-tests:
    name: E2E (${{ matrix.spec }})
    needs: [changes, build, unit-tests]
    if: needs.changes.outputs.specs != '[]' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Ships the browsers and their system deps preinstalled; must track the
    # @playwright/test version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # --user 1001 is the setup Playwright documents for GitHub Actions:
      # container jobs run as root by default, which breaks browser launch.
      # --ipc=host avoids Chromium crashing on Docker's 64MB default /dev/shm.
      options: --user 1001 --ipc=host
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.changes.outputs.specs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Run Playwright
        run: pnpm exec playwright test src/__tests__/e2e/${{ matrix.spec }}.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.spec }}
          path: playwright-report/
          retention-days: 7

  # A skipped job never reports a status, which would leave a required check
  # pending forever. Make THIS the required check on master, not e2e-tests.
  e2e-gate:
    name: E2E tests
    needs: [changes, e2e-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check e2e result
        run: |
          changes="${{ needs.changes.result }}"
          result="${{ needs.e2e-tests.result }}"
          echo "changes: $changes / e2e-tests: $result"
          # A failed `changes` job also skips e2e-tests, which would otherwise
          # read as a pass -- so require it to have succeeded first.
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed ($changes)"
            exit 1
          fi
          # "skipped" is a legitimate pass: no spec's paths were touched.
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            exit 0
          fi
          exit 1
