name: CI

on:
  push:
    branches: [dev]

# No job writes to the repo, so the token is read-only by default.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No `version` input: the pnpm version comes from the `packageManager`
      # field in package.json. Setting both makes action-setup fail the step
      # whenever they disagree.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # docs/overview.html must be re-stamped after an ADR changes (docs/README.md).
      - name: Docs overview in sync
        run: pnpm docs:check

      - name: Run Vitest
        run: pnpm test:unit
