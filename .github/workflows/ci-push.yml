name: CI

on:
  push:
    branches: [dev]

# No job writes to the repo, so the token is read-only by default.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm, Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      # docs/overview.html must be re-stamped after an ADR changes (docs/README.md).
      - name: Docs overview in sync
        run: pnpm docs:check

      - name: Run Vitest
        run: pnpm test:unit
