# Path filters mapping changed files -> the e2e spec(s) that must re-run.
#
# Each key (except `shared`) is named after a file in src/__tests__/e2e/,
# so dorny/paths-filter's `changes` output feeds the CI matrix directly.
#
# Specs are NOT page-scoped: every spec navigates across page boundaries, so
# each filter lists every page it asserts against, not just its primary one.

# Imported or honoured by all four pages -- any change re-runs everything.
shared: &shared
  - 'src/layouts/**'
  - 'src/components/**'
  - 'src/__tests__/e2e/helpers/**'
  - 'public/**'
  - 'astro.config.mjs'
  - 'playwright.config.ts'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - '.github/workflows/ci-pull.yml'
  - '.github/e2e-filters.yml'

# Clicks through to /projects and asserts the "Selected work" heading.
index:
  - *shared
  - 'src/pages/index.astro'
  - 'src/pages/projects.astro'

# Clicks "Home" and asserts the homepage heading. Also drives the preview
# dialogs, whose content comes from the `projects` collection -- so it depends
# on the loader and its GitHub mapping, not just on the page.
projects:
  - *shared
  - 'src/pages/projects.astro'
  - 'src/pages/index.astro'
  - 'src/content.config.ts'
  - 'src/lib/github.ts'
  - 'src/lib/sanitize.ts'

# Opens a post from the index and returns home. Also asserts the /blog/<slug>/
# href shape produced by sanitizeSlug, so it depends on both the posts and the
# slug rules.
blog:
  - *shared
  - 'src/pages/blog/**'
  - 'src/pages/index.astro'
  - 'src/lib/sanitize.ts'
  - 'src/content/**'
  - 'src/content.config.ts'

# Reaches the post through the /blog index, and asserts the *oldest* post's
# title/date/description read from its frontmatter at run time, so any new post can change what it targets.
blog-post:
  - *shared
  - 'src/pages/blog/**'
  - 'src/lib/sanitize.ts'
  - 'src/content/**'
  - 'src/content.config.ts'

# Scans every page (home, projects, blog index, one post, the 404) in both themes,
# plus the open project dialog and the open mobile menu, with axe. It picks the
# oldest post from the Markdown at run time, so posts and the content schema matter.
a11y:
  - *shared
  - 'src/pages/**'
  - 'src/content/**'
  - 'src/content.config.ts'
  - 'src/lib/sanitize.ts'
